# Publishes to PyPI when a v* tag is pushed, using PyPI Trusted Publishing
# (OIDC) — no API token is stored anywhere — then creates the GitHub release
# with that version's CHANGELOG.md section as its notes.
#
# One-time PyPI setup: https://pypi.org/manage/project/yinv/settings/publishing/
#   Owner: nixmaldonado · Repository: yinv · Workflow: publish.yml · Environment: pypi

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Check CHANGELOG has notes for this version
        run: |
          .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q

      - name: Build
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/release-notes.sh "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
